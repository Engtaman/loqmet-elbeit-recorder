<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تسجيل الصوت | لقمة البيت</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f5f3ee;color:#253f35;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:white;border:1px solid #e8e7df;border-radius:26px;padding:25px;box-shadow:0 12px 35px #263d3214;text-align:center}.mark{margin:auto;width:62px;height:62px;display:grid;place-items:center;border-radius:22px;background:#edf3ed;font-size:30px}.eyebrow{color:#869188;font-size:12px;margin-top:14px}.card h1{font-size:23px;margin:4px 0}.card p{font-size:14px;color:#68766e;line-height:1.8;margin:8px 0 18px}.consent{display:flex;gap:9px;text-align:right;align-items:flex-start;background:#f7f7f2;border-radius:14px;padding:12px;font-size:12px;line-height:1.7}.consent input{width:19px;height:19px;accent-color:#315343;flex:none;margin:2px 0 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}button{border:1px solid #e3e5df;background:white;border-radius:14px;min-height:48px;padding:10px;color:#253f35;font:inherit;font-weight:650}button.primary{background:#315343;color:white;border-color:#315343}button:disabled{opacity:.45}.status{min-height:24px;margin-top:14px!important;font-size:12px!important}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:#a95d39}.foot{font-size:11px!important;color:#8a938d!important;margin:14px 0 0!important}</style><body><main class="card"><div class="mark">🎙️</div><div class="eyebrow">لقمة البيت · تسجيل صوتي</div><h1>قولي الموجود والناقص</h1><p>مثال: «ما عنديش طماطم ولا فراخ، وعندي سمك وبيض». التسجيل القصير يتحول لنص ثم ترجعين للتطبيق لمراجعته.</p><label class="consent"><input id="consent" type="checkbox"><span>أوافق على إرسال التسجيل إلى Google Gemini لتحويله إلى نص. قد يحتفظ Gemini بالملف مؤقتًا لمدة تصل إلى 48 ساعة؛ التطبيق نفسه لا يحفظه.</span></label><div class="buttons"><button id="start" class="primary" disabled>ابدئي التسجيل</button><button id="stop" disabled>إيقاف وإرسال</button></div><p id="status" class="status" aria-live="polite">التسجيل متوقف <span class="timer" id="timer"></span></p><p class="foot">حد أقصى 60 ثانية. بعد الإرسال راجعي النص قبل تحديث مخزون البيت.</p></main><script>const params=new URLSearchParams(location.search),replyOrigin=params.get('replyOrigin');const allowedOrigin=/^https://(?:script.google.com|[a-z0-9-]+-script.googleusercontent.com)$/.test(replyOrigin||'');const consent=document.getElementById('consent'),start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),timer=document.getElementById('timer');let recorder,stream,chunks=[],started=0,tick;start.disabled=!allowedOrigin;consent.onchange=()=>{start.disabled=!consent.checked||!allowedOrigin};function chooseType(){return ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}start.onclick=async()=>{if(!allowedOrigin){status.textContent='رابط التطبيق غير معتمد للرد الآمن. افتحي التسجيل من داخل التطبيق.';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=chooseType();recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=sendRecording;recorder.start(500);started=Date.now();start.disabled=true;stop.disabled=false;status.textContent='بسجّل دلوقتي… اضغطي إيقاف لما تخلصي.';tick=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);timer.textContent=' · '+s+' ث';if(s>=60)stop.click()},250)}catch(e){status.textContent=e&&e.name==='NotAllowedError'?'اسمحي للموقع باستخدام الميكروفون من إعدادات المتصفح ثم جرّبي تاني.':'تعذّر تشغيل الميكروفون على هذا الجهاز أو المتصفح.'}};stop.onclick=()=>{if(!recorder||recorder.state==='inactive')return;stop.disabled=true;clearInterval(tick);status.textContent='بجهّز التسجيل للإرسال…';recorder.stop();stream.getTracks().forEach(t=>t.stop())};async function sendRecording(){const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(blob.size>2100000){status.textContent='التسجيل أكبر من الحد المسموح. جرّبي جملة أقصر.';start.disabled=!consent.checked;return}if(!blob.size){status.textContent='مافيش صوت واضح في التسجيل. جرّبي تاني.';start.disabled=!consent.checked;return}const mime=(blob.type||'audio/webm').split(';')[0];if(!['audio/webm','audio/ogg','audio/mp4','audio/mpeg','audio/wav'].includes(mime)){status.textContent='صيغة التسجيل غير مدعومة على هذا الجهاز.';return}status.textContent='ببعت التسجيل للتطبيق بأمان…';const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)});const audioBase64=String(url).split(',')[1];if(!window.opener){status.textContent='التطبيق الأصلي اتقفل. اقفلي الصفحة وابدئي من زر الصوت في التطبيق.';return}window.opener.postMessage({type:'qimma-audio',audioBase64,mimeType:mime},replyOrigin);status.textContent='وصل التسجيل للتطبيق. يمكنك الرجوع إليه الآن.';setTimeout(()=>window.close(),900)}</script></body></html>
